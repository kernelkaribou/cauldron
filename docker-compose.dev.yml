services:
  server:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "apt-get update && apt-get install -y python3 make g++ && npm install && npm run dev"
    ports:
      - "8090:8090"
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
      - dev_data:/data
    environment:
      - DATA_DIR=/data
      - NODE_ENV=development

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - API_URL=http://server:8090

volumes:
  server_modules:
  frontend_modules:
  dev_data:
